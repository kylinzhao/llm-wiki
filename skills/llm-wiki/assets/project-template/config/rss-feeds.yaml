# Legacy RSS ingestion config. New projects should declare upstream sources in
# upstream/wiki-sources.json; tools/update_wiki.py generates the per-run RSS
# config for tools/rss_sync.py from that unified source list.

feeds: []

rate_limits:
  default_min_interval_seconds: 60
  max_concurrency: 1
  per_host: {}

retry:
  max_attempts: 2
  backoff_seconds: 30
